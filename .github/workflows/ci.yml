name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, curl, openssl, mbstring
          coverage: none
      - name: Lint
        run: find src templates public bin tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null && php -l bin/vigil
      - name: Tests
        run: php tests/run.php

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vigil .
